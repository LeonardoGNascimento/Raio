[package]
name = "raio"
version = "0.3.12"
description = "Raio — HTTP client rápido, offline e git-friendly"
authors = ["Leonardo Nascimento"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "raio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "cookies", "multipart"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
dirs = "5"
tiny_http = "0.12"
tauri-plugin-dialog = "2"
reqwest_cookie_store = "0.8"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"    # otimiza para tamanho
lto = "thin"       # fat LTO relinkava tudo a cada release no CI; thin aproveita o cache
codegen-units = 16 # paraleliza codegen; custo de tamanho ~pequeno, build bem mais rápido
strip = true
panic = "abort"
