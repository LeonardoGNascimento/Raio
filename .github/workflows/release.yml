name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: instalar dependências de sistema (linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: valida e normaliza a chave de assinatura
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY vazio — crie como Repository secret"
            exit 1
          fi
          # whitelist base64: remove qualquer lixo do copiar-colar (inclusive unicode invisivel)
          CLEAN=$(printf '%s' "$KEY" | tr -cd 'A-Za-z0-9+/=')
          DEC=$(printf '%s' "$CLEAN" | python3 -c 'import base64,sys; print(base64.b64decode(sys.stdin.read()).decode(errors="replace")[:80])' 2>/dev/null || true)
          if printf '%s' "$DEC" | grep -qi 'public key'; then
            echo "::error::o secret contém a chave PÚBLICA (raio.key.pub). Cole o conteúdo de ~/.tauri/raio.key"
            exit 1
          fi
          if ! printf '%s' "$DEC" | grep -qi 'secret key'; then
            echo "::error::secret não parece a chave privada do tauri signer. Cole o conteúdo exato de ~/.tauri/raio.key"
            exit 1
          fi
          echo "::add-mask::$CLEAN"
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN" >> "$GITHUB_ENV"
          echo "::warning::chave ok e normalizada (${#CLEAN} chars - sha $(printf %s "$CLEAN" | sha256sum | cut -c1-16))"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "raio ${{ github.ref_name }}"
          releaseBody: |
            Client HTTP desktop — contrato, snapshot, trace e vigia de rotas.
            Baixe o instalador do seu sistema abaixo.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
