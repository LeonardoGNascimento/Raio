name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: instalar dependências de sistema (linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: valida secret de assinatura
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY vazio — crie como Repository secret (Settings > Secrets and variables > Actions > aba Secrets)"
            exit 1
          fi
          DEC=$(printf '%s' "$KEY" | base64 -d 2>/dev/null | head -c 120 || true)
          HAY="$DEC$KEY"
          if printf '%s' "$HAY" | grep -qi 'public key'; then
            echo "::error::o secret contém a chave PÚBLICA (raio.key.pub). Cole o conteúdo de ~/.tauri/raio.key"
            exit 1
          fi
          if ! printf '%s' "$HAY" | grep -qi 'secret key'; then
            echo "::error::secret não parece uma chave privada do tauri signer. Cole o conteúdo exato de ~/.tauri/raio.key"
            exit 1
          fi
          echo "::warning::secret ok · ${#KEY} chars · sha256 $(printf '%s' "$KEY" | sha256sum | cut -c1-16)"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "raio ${{ github.ref_name }}"
          releaseBody: |
            Client HTTP desktop — contrato, snapshot, trace e vigia de rotas.
            Baixe o instalador do seu sistema abaixo.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
